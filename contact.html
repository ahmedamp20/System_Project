<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Blog - Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contact Me</h1>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
    <main>
        <article>
            <h2>Send a Message</h2>
            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="1" max="120">

                <label for="birthdate">Date of birth</label>
                <input type="date" id="birthdate" name="birthdate">

                <fieldset>
                    <legend>Gender</legend>
                    <label for="male"><input type="radio" id="male" name="gender" value="male"> Male</label>
                    <label for="female"><input type="radio" id="female" name="gender" value="female"> Female</label>
                </fieldset>

                <fieldset>
                    <legend>Interests</legend>
                    <label for="html"><input type="checkbox" id="html" name="interests" value="html"> HTML</label>
                    <label for="css"><input type="checkbox" id="css" name="interests" value="css"> CSS</label>
                    <label for="js"><input type="checkbox" id="js" name="interests" value="js"> JavaScript</label>
                </fieldset>

                <label for="subject">Subject</label>
                <select id="subject" name="subject">
                    <option value="question">Question</option>
                    <option value="feedback">Feedback</option>
                    <option value="other">Other</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"></textarea>

                <button type="submit">Send</button>
            </form>
        </article>
    </main>
    <footer>
        <p>&copy; 2026 My Blog</p>
    </footer>
</body>
</html>
